[project]
name = "devpilot-github-server"
version = "0.1.0"
description = "A GitHub repository intelligence MCP server for DevPilot AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx2>=2.14.0",
    "mcp[cli]>=2.3.0",
    "pydantic>=2.14.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[project.scripts]
devpilot-github-server = "github_server:main"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["README.md"]

[tool.ruff.lint]
select = [
    "C4",
    "C90",
    "E",
    "F",
    "I",
    "PERF",
    "PL",
    "UP",
]
ignore = ["PERF203", "PLC0415", "PLR0402"]
mccabe.max-complexity = 24

[tool.ruff.lint.pylint]
allow-magic-value-types = ["bytes", "float", "int", "str"]
max-args = 23
max-branches = 23
max-returns = 13
max-statements = 102
